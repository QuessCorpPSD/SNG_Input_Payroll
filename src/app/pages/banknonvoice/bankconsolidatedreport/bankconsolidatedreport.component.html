<div class="page-wrapper">

    <div class="scrollable-content">

        <div style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 700;">
            Bank Consolidated Report</div>

        <div class="container py-2">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-muted small">Report Type</label>
                    <select class="form-select form-select-sm">
                        <option value="NonInvoiceBatchConsolidate">Batch Consolidate</option>
                        <option value="NonInvoiceBatchSummary">Batch Summary</option>

                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">From Date</label>
                    <input class="form-control form-control-sm" type="date" />
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">To Date</label>
                    <input class="form-control form-control-sm" type="date" />
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">Search By</label>
                    <input class="form-control form-control-sm" type="text" placeholder="Employeeid or Invoice no" />
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">
                        Entity<span class="text-danger">*</span>
                    </label>

                    <div class="dropdown w-100">

                        <button class="form-select form-select-sm text-start" type="button" data-bs-toggle="dropdown">
                            {{ selectedEntityIds.length > 0 ? selectedEntityIds.length + ' Selected' : 'Select' }}
                        </button>

                        <!-- Dropdown -->
                        <div class="dropdown-menu entity-dropdown p-2 w-100" data-bs-auto-close="outside">

                            <!-- Header -->
                            <div class="d-flex justify-content-between mb-2">
                                <button class="btn btn-light btn-sm" (click)="selectAll(); $event.stopPropagation()">
                                    Check All
                                </button>

                                <button class="btn btn-light btn-sm" (click)="unselectAll(); $event.stopPropagation()">
                                    Uncheck All
                                </button>
                            </div>

                            <!-- List -->
                            <div style="max-height: 200px; overflow-y: auto;">

                                <div *ngFor="let e of EntityList" class="form-check">

                                    <input class="form-check-input" type="checkbox" [value]="e.Entity_Id"
                                        [checked]="selectedEntityIds.includes(e.Entity_Id)"
                                        (click)="$event.stopPropagation()"
                                        (change)="onEntitySelect(e.Entity_Id, $event)" />

                                    <label class="form-check-label">
                                        {{ e.Entity_Name }}
                                    </label>

                                </div>

                            </div>

                        </div>
                    </div>
                </div>

                <div class="col-md-2 d-flex gap-2">

                    <button class="btn btn-secondary btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="Export to Excel">
                        <mat-icon>download</mat-icon>
                    </button>

                </div>
            </div>


        </div>
    </div>
</div>
