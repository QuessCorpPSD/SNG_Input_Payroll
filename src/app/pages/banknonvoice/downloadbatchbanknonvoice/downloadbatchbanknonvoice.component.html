<div class="page-wrapper">

    <div class="scrollable-content">

        <div style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 700;">
            Download Batch</div>

        <div class="container py-2">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-muted small">Batch Type</label>
                    <select class="form-select form-select-sm" [(ngModel)]="BatchType" (change)="onBatchChange()">
                        <option value="">--select--</option>
                        <option *ngFor="let p of batchtypes" [value]="p.value">{{p.name}} </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">Batch Date</label>
                    <input class="form-control form-control-sm" type="date" [(ngModel)]="BatchDate" (change)="onBatchChange()"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">Batch Id</label>
                    <select class="form-select form-select-sm" [(ngModel)]="selectedBatchId" name="BatchId" >
                        <option value="">Select</option>
                        <option *ngFor="let batch of batchList" [value]="batch.batchid">
                            {{ batch.batchid }}
                        </option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">

                    <button class="btn btn-secondary btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="Download" (click)="downloadBatch()">
                        <mat-icon>download</mat-icon>
                    </button>

                </div>
            </div>


        </div>
    </div>
</div>
