<div style="position: relative;">
    <div class="page-title page-title-position">Netpay Summary</div>

    <div class="row py-2">
        <div class="col-12 d-flex justify-content-end align-items-end">

            <div class="me-3" style="width: 240px;">
                <label class="form-label text-muted small">Entity</label>
                <select class="form-select form-select-sm" [(ngModel)]="Entity">
                    <option value="">Select Entity</option>
                    <option *ngFor="let p of entity" [value]="p.Entity_Id">
                        {{ p.Entity_Name }}
                    </option>
                </select>
            </div>

            <app-bank-invoice [visibleDropdowns]="[1, 3]" [payPeriodTypefromParent]="payPeriodTypefromParent"
                [showExportButton]="true" (exportClicked)="onTemplateClick()" (companyUI)="handleCompanyEvent($event)"
                (payPeriodChange)="handlePayPeriodChange($event)">
            </app-bank-invoice>

        </div>
    </div>
</div>

<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
