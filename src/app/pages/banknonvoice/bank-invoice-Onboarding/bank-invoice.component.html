<div class="right-align">
    <div *ngIf="visibleDropdowns.includes(1)"
        style="width: 160px; height: 52px; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; display: inline-flex">
        <div
            style="width: 160px; height: 12.35px; color: var(--text-field-heading-, #89898B); font-size: 10px; font-family: Nunito Sans; font-weight: 500; word-wrap: break-word">
            Company Code</div>
        <div>
            <CompanyPicker (companyEmit)="handleCompanyEvent($event)"></CompanyPicker>
        </div>
    </div>

    <div *ngIf="visibleDropdowns.includes(15)"
        style="width: 160px; height: 52px; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; display: inline-flex">
        <div
            style="width: 160px; height: 12.35px; color: var(--text-field-heading-, #89898B); font-size: 10px; font-family: Nunito Sans; font-weight: 500; word-wrap: break-word">
            Client Name</div>
        <div>
            <CompanyPicker (companyEmit)="handleCompanyEvent($event)"></CompanyPicker>
        </div>
    </div>

    <div *ngIf="showPurpose" style="width: 150px; display: flex; flex-direction: column; gap: 8px; margin-right: 10px;">

        <div style="height: 12px; color: #89898B; font-size: 10px; font-family: Nunito Sans; font-weight: 500;">
            Purpose
        </div>

        <select [(ngModel)]="Purpose" (change)="onPurposeChange()" style="height: 30px; width: 150px;">

            <option value="">Select Purpose</option>

            <option *ngFor="let item of PurposeList" [value]="item.Value">
                {{ item.Label }}
            </option>

        </select>

    </div>

    <div *ngIf="visibleDropdowns.includes(2)"
        style="width: 160px; height: 52px; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; display: inline-flex">
        <div
            style="width: 160px; height: 12.35px; color: var(--text-field-heading-, #89898B); font-size: 10px; font-family: Nunito Sans; font-weight: 500; word-wrap: break-word">
            Pay Period</div>
        <div class="input-group">
            <PayPeriod [selectedCompanyId]="selectedCC" [payPeriodType]="payPeriodTypetoChild"
                (payperiodEmit)="handlePayperiodEvent($event)"></PayPeriod>
        </div>
    </div>
    <div *ngIf="showEmployeeCode"
        style="width: 160px; height: 52px; flex-direction: row; justify-content: flex-start; align-items: flex-start; gap: 16px; display: inline-flex">
        <div
            style="width: 150px; height: 52px; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; display: inline-flex">
            <div
                style="width: 150px; height: 12.35px; color: var(--text-field-heading-, #89898B); font-size: 10px; font-family: Nunito Sans; font-weight: 500;">
                Employee Code
            </div>
            <input type="type" [(ngModel)]="EmployeeCode" (change)="onEmployeeCodeChange()" placeholder="Employee Code"
                (keypress)="allowAlphaNumeric($event)" maxlength="10" (paste)="onPaste($event)"
                style="width: 150px; height: 30px; border-radius: 6px; border: 1px solid #D9D9D9; padding: 4px 8px; font-family: Nunito Sans; font-size: 12px;">
        </div>
    </div>

    <div *ngIf="showSalaryHoldType"
        style="width:150px; display:flex; flex-direction:column; gap:8px; margin-right:10px;">

        <div style="height:12px; color:#89898B; font-size:10px; font-family:Nunito Sans; font-weight:500;">
            Salary Hold Type
        </div>

        <select [(ngModel)]="SalaryHoldType" (change)="onSalaryHoldTypeChange()"
            style="height:30px; width:150px; border:1px solid #ccc; border-radius:4px;">
            <option *ngFor="let item of SalaryHoldTypeList" [value]="item.Value">
                {{ item.Label }}
            </option>
        </select>

    </div>

    <div *ngIf="showDateRange"
        style="width: 320px; height: 52px; flex-direction: row; justify-content: flex-start; align-items: flex-start; gap: 16px; display: inline-flex">

        <!-- From Date -->
        <div
            style="width: 150px; height: 52px; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; display: inline-flex">
            <div
                style="width: 150px; height: 12.35px; color: var(--text-field-heading-, #89898B); font-size: 10px; font-family: Nunito Sans; font-weight: 500;">
                From Date
            </div>
            <input type="date" [(ngModel)]="fromDate" (change)="onDateChange()"
                style="width: 150px; height: 30px; border-radius: 6px; border: 1px solid #D9D9D9; padding: 4px 8px; font-family: Nunito Sans; font-size: 12px;">
        </div>

        <!-- To Date -->
        <div
            style="width: 150px; height: 52px; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; display: inline-flex">
            <div
                style="width: 150px; height: 12.35px; color: var(--text-field-heading-, #89898B); font-size: 10px; font-family: Nunito Sans; font-weight: 500;">
                To Date
            </div>
            <input type="date" [(ngModel)]="toDate" (change)="onDateChange()"
                style="width: 150px; height: 30px; border-radius: 6px; border: 1px solid #D9D9D9; padding: 4px 8px; font-family: Nunito Sans; font-size: 12px;">
        </div>

    </div>
    <div *ngIf="showSearchButton"
        style="padding-top: 19px; width: 150px; height: 52px; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; display: inline-flex">
        <button (click)="searchClick()"
            style="width: 130px; height: 30px; padding-left: 16px; padding-right: 16px; padding-top: 6px; padding-bottom: 6px; background: #302CB3; box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.20); border-radius: 6px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; border: none;">
            <div
                style="color: var(--background, #F5F5F5); font-size: 12px; font-family: Nunito Sans; font-weight: 600; line-height: 22.40px; letter-spacing: 0.24px; word-wrap: break-word">
                Search</div>
        </button>
    </div>


</div>
