<div style="position: relative;">
    <div class="page-title page-title-position">Employee Salary Release</div>
    <app-bank-invoice [visibleDropdowns]="[1, 2]" [showSearchButton]="true"  [showTemplateButton]="true" [showImportButton]="true" [showExportButton]="true"
        [payPeriodTypefromParent]="payPeriodTypefromParent" (companyUI)="handleCompanyEvent($event)"
        (payperiodUI)="handlePayperiodEvent($event)" (searchClicked)="searchClick()" (templateClicked)="onTemplateClick()" (importClicked)="onFileChange($event)" (exportClicked)="onExportClick()">
    </app-bank-invoice>
</div>

<div class="main-card" [hidden]="dataSource.data.length === 0">
    <div class="top-bar">
        <div class="action-buttons">
            <div class="search-box">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 12 12" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M8.30883 9.01596C7.539 9.63177 6.5625 10 5.5 10C3.01472 10 1 7.98528 1 5.5C1 3.01472 3.01472 1 5.5 1C7.98528 1 10 3.01472 10 5.5C10 6.56251 9.63176 7.53901 9.01594 8.30885L10.8535 10.1465C11.0488 10.3417 11.0488 10.6583 10.8535 10.8536C10.6583 11.0488 10.3417 11.0488 10.1464 10.8536L8.30883 9.01596ZM2 5.5C2 3.567 3.567 2 5.5 2C7.433 2 9 3.567 9 5.5C9 6.44299 8.62707 7.29888 8.02066 7.92823C8.00355 7.94139 7.98711 7.95579 7.97144 7.97146C7.95578 7.98712 7.94137 8.00357 7.92822 8.02067C7.29887 8.62708 6.44299 9 5.5 9C3.567 9 2 7.433 2 5.5Z"
                            fill="#7E7E7E" />
                    </svg>
                </i>
                <input type="text" [(ngModel)]="searchText" (keyup)="applyFilter()" placeholder="Search" />
            </div>
        </div>
    </div>
       
    <div class="table-wrapper" >
        <div class="example-container mat-elevation-z8">
            <table mat-table #searchgrid [dataSource]="dataSource" matSort class="custom-table mat-elevation-z8">

                <ng-container matColumnDef="SNo">
                    <mat-header-cell *matHeaderCellDef><div class="cell-center">S NO.</div></mat-header-cell>
                    <mat-cell *matCellDef="let element"><div class="cell-center">{{ element.SNo }}</div></mat-cell>
                </ng-container>

                <ng-container matColumnDef="Company_Code">
                    <mat-header-cell *matHeaderCellDef><div class="cell-center">COMPANY CODE</div></mat-header-cell>
                    <mat-cell *matCellDef="let element"><div class="cell-center">{{ element.Company_Code }}</div></mat-cell>
                </ng-container>

                <ng-container matColumnDef="Group_Name">
                    <mat-header-cell *matHeaderCellDef><div class="cell-center">GROUP NAME</div></mat-header-cell>
                    <mat-cell *matCellDef="let element"><div class="cell-center-wrap">{{ element.Group_Name }}</div></mat-cell>
                </ng-container>

                <ng-container matColumnDef="Vendor_Name">
                    <mat-header-cell *matHeaderCellDef><div class="cell-center">VENDOR NAME</div></mat-header-cell>
                    <mat-cell *matCellDef="let element"><div class="cell-center">{{ element.Vendor_Name }}</div></mat-cell>
                </ng-container>

                <ng-container matColumnDef="Pay_Period">
                    <mat-header-cell *matHeaderCellDef><div class="cell-center">PAY PERIOD</div></mat-header-cell>
                    <mat-cell *matCellDef="let element"><div class="cell-center">{{ element.Pay_Period }}</div></mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; let i = index; columns: displayedColumns;"></mat-row>
            </table>
        </div>
        <mat-paginator #holdPaginator class="mat-footer-paginator" [pageSizeOptions]="[5, 10, 25, 100]"
            showFirstLastButtons stickyEnd>
        </mat-paginator>
    </div>
</div>


<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets\Loading.gif" alt="Loading...">
</div>
