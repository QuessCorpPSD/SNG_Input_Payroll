<div class="page-wrapper">
    <div class="scrollable-content">
        <div style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 700;">
           Generic Upload
        </div>
        <div class="container py-2">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-muted small">Upload Type</label>
                    <select class="form-select form-select-sm" [(ngModel)]="upload_type"
                        placeholder="Select Type">
                        <option *ngFor="let type of uploadtypes" [value]="type.GEN_vDescription">{{type.GEN_vDescription}}</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">Import<span class="text-danger"></span></label>
                    <input class="form-control" style="height: calc(1.5em + 0.5rem + 1px) !important;padding-top: 5px !important;" type="file" #fileInput (change)="onFileChange($event)" accept="*" />
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-upload"
                        (click)="ImportClick()" matTooltip="Import">
                        <mat-icon>cloud_upload</mat-icon>
                    </button>
                    <button class="btn btn-secondary btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="Download Template" (click)="TemplateClick()">
                        <mat-icon>download</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets\Loading.gif" alt="Loading...">
</div>

<app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="showPopup = false">
</app-alertpopup>
