<div class="page-wrapper">
    <div class="scrollable-content">

        <div style="color: #302CB3; font-size: 22px; font-family: Nunito Sans;
             font-weight: 700; min-width: 960px">
            Invoice Summary Report
        </div>

        <div class="container py-4">

            <div class="row g-3 mb-3">

                <!-- Entity Name -->
                <div class="col-md-3">
                    <label class="form-label text-muted small">Entity Name</label>
                    <select class="form-select form-select-sm" [(ngModel)]="entity" [disabled]="isCompanySelected"
                        (change)="onEntityChange()">
                        <option value="">Select</option>
                        <option *ngFor="let item of entityList" [value]="item.Entity_Id">
                            {{ item.Entity_Name }}
                        </option>
                    </select>
                </div>

                <!-- Company Code -->
                <div class="col-md-3">
                    <label class="form-label text-muted small">Company Code</label>
                    <companyall [(ngModel)]="company" [disabled]="isEntitySelected"
                        (companyEmit)="handleCompanyEvent($event)">
                    </companyall>
                </div>

                <!-- From Date -->
                <div class="col-md-3">
                    <label class="form-label">From Date: <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" [(ngModel)]="startDate" />
                </div>

            </div>

            <div class="row g-3 mb-3 align-items-end">

                <!-- To Date -->
                <div class="col-md-3">
                    <label class="form-label">To Date: <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" [(ngModel)]="endDate" />
                </div>

                <!-- Report Type -->
                <div class="col-md-3">
                    <label class="form-label text-muted small">Report Type</label>
                    <select class="form-select form-select-sm" [(ngModel)]="reportType">
                        <option value="">Select</option>
                        <option *ngFor="let type of reportTypes" [value]="type.GEN_iID">
                            {{ type.GEN_vDescription }}
                        </option>
                    </select>
                </div>

                <!-- Export Button -->
                <div class="col-md-3 d-flex align-items-end">
                    <button type="button" class="btn btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="Export to Excel" (click)="exportToExcel()">
                        <mat-icon>table_chart</mat-icon>
                    </button>
                </div>

            </div>

        </div>

    </div>
</div>
