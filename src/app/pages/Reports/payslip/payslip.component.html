<div style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 700;">
    Payslip</div>

<div class="container">
    <div class="row py-2">
        <br />
        <div class="row align-items-end" style="padding-bottom: 1rem;">
            <div class="col-md-3 ">
                <label class="form-label text-muted small">Company Code</label>
                <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Pay Period</label>
                <PayPeriod [selectedCompanyId]="companyId" [payPeriodType]="payPeriodTypefromParentall"
                    (payperiodEmit)="handlePayperiodEvent($event)"></PayPeriod>
            </div>
            <div class="col-md-2" style="padding-top: 25px;">
                <div class="d-flex gap-2">
                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-download"
                        matTooltip="Search" (click)="Searchclick()">
                        <mat-icon>search</mat-icon>
                    </button>
                </div>
            </div>
        </div>

        <table class="table table-bordered">
            <tr>
                <th style="display: none;">
                    <span class="span-text-header">Employee Id</span>
                </th>
                <th>
                    <span class="span-text-header">Employee Id</span>
                </th>
                <th>
                    <span class="span-text-header">Name</span>
                </th>
                <th>
                    <span class="span-text-header">Date of Joining</span>
                </th>
                <th>
                    <span class="span-text-header">Designation</span>
                </th>
                <th>
                    <span class="span-text-header">Gross Salary</span>
                </th>
                <th>
                    <span class="span-text-header">Total Deduction</span>
                </th>
                <th>
                    <span class="span-text-header">Net Pay</span>
                </th>
                <th>
                    <span class="span-text-header">Download</span>
                </th>
            </tr>
            <tbody *ngIf="paginatedData">
                <tr *ngFor="let item of paginatedData; trackBy: trackRow" style="height: 30px;vertical-align: middle;">
                    <td style="display: none;">
                        <span class="span-text-detail">{{item.Employee_Id}}</span>
                    </td>
                    <td>
                        <span class="span-text-detail">{{item.Employee_Code}}</span>
                    </td>
                    <td>
                        <span class="span-text-detail">{{item.Name}}</span>
                    </td>
                    <td>
                        <span class="span-text-detail">{{item.Date_Of_Joining}}</span>
                    </td>
                    <td>
                        <span class="span-text-detail">{{item.Designation_Name}}</span>
                    </td>
                    <td>
                        <span class="span-text-detail">{{item.Gross_salary}}</span>
                    </td>
                    <td>
                        <span class="span-text-detail">{{item.TotalDeduction}}</span>
                    </td>
                    <td>
                        <span class="span-text-detail">{{item.Need_To_Pay}}</span>
                    </td>
                    <td style="text-align: center;">
                        <mat-icon (click)="Download(item.Employee_Id,item.Employee_Code)"
                            style="cursor: pointer;">download</mat-icon>
                    </td>
                </tr>
            </tbody>
        </table>
        <div style="margin-bottom: 5%;">
            <mat-paginator [length]="filteredRows.length" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20, 50]"
                (page)="onPageChange($event)">
            </mat-paginator>
        </div>
    </div>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
