<div class="page-wrapper" style="padding-top: 10px;">

    <div class="scrollable-content">
        <div style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 700;">
            Credit Note Balance Report
        </div>

        <div class="container py-2">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-muted small">Comapny Code</label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">Start Date</label>
                    <input type="date"  [(ngModel)]="StartDate"  class="w-100 custom-height rounded-1 select-drop" appearance="outline"
                        style="background-color: white;height:30px;" (change)="onStartChange($event)" />
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">End Date</label>
                    <input type="date" [(ngModel)]="EndDate"  class="w-100 custom-height rounded-1 select-drop" appearance="outline"
                        style="background-color: white;height:30px;" (change)="onEndChange($event)" />
                </div>
                <div class="col-md-2" style="padding-top: 25px;">
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-download"
                            matTooltip="ExportToExcel" (click)="exportToExcel()">
                            <mat-icon>download</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
<app-alertpopup *ngIf="showPopupalert" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="showPopupalert = false">
</app-alertpopup>
