<div style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 700;">
    Timesheet Summary Report</div>

<div class="container-fluid">
    <div class="row py-2">
        <br />
        <form>
            <div class="row align-items-end ">
                <div class="col-md-3 ">
                    <label class="form-label text-muted small">Company Code</label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                </div>

                <div class="col-md-3">
                    <label class="form-label text-muted small">Site Name</label>
                    <groupname [selectedCompanyId]="companyId" (sitenameEmit)="groupnameEvent($event)">
                    </groupname>
                </div>

                <div class="col-md-2">
                    <label class="form-label text-muted small">Location</label>
                    <select class="form-select form-select-sm small-input" [(ngModel)]="selectedLocation"
                        name="location"> 
                        <option value="">Select Location</option>
                        <option *ngFor="let l of Location" [value]="l.city_Id">{{ l.city_Name }}</option>
                    </select>
                </div>


                <div class="col-md-3">
                    <label class="form-label text-muted small">Pay Period</label>
                    <select class="form-select form-select-sm small-input" [(ngModel)]="selectedYear" name="year">
                        <option value="">Select Year</option>
                        <option *ngFor="let y of years" [value]="y.year">{{ y.year }}</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">Pay Period</label>
                    <select class="form-select form-select-sm small-input" [(ngModel)]="selectedStatus" name="status"> >
                        <option value="-1">All</option>
                        <option value="1">Pending TS</option>
                        <option value="2">Submitted TS</option>
                        <option value="4">Invoice Audited</option>
                        <option value="0">Rejected Invoice</option>
                    </select>
                </div>

                <div class="col-md-2" style="padding-top: 25px;">
                    <div class="d-flex gap-2">

                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-download"
                            matTooltip="Template" (click)="Download()">
                            <mat-icon>download</mat-icon>
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>
