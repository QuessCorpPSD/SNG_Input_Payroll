<div style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 700; padding-top: 10px;">
    Other Income Report Entitywise</div>

<div class="container-fluid">
    <div class="row py-2">
        <div class="row align-items-end ">
            <div class="col-md-3 ">
                <label class="form-label text-muted small">Entity</label>
                <select class="form-select form-select-sm" [(ngModel)]="Entity">
                    <option *ngFor="let p of entitySearch" [value]="p.EntityId">
                        {{ p.EntityName }}
                    </option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Pay Period</label>
                <select class="form-select form-select-sm" [(ngModel)]="PayPeriod">
                    <option *ngFor="let pp of Payperiod" [value]="pp.pay_Period">
                        {{ pp.pay_Period }}
                    </option>
                </select>
            </div>
            <div class="col-md-2" style="padding-top: 25px;">
                <div class="d-flex gap-2">
                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-download"
                        matTooltip="ExportToExcel" (click)="exportToExcel()">
                        <mat-icon>download</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
<app-alertpopup *ngIf="showPopupalert" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="showPopupalert = false">
</app-alertpopup>
