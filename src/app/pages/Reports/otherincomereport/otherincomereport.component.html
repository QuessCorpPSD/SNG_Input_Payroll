<div style="padding-top: 10px;">
    <div style="color: #302CB3; font-size: 22px; font-family: Nunito Sans; font-weight: 700;">
        Other Income Report
    </div>
    <div class="container py-2">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label text-muted small">Company Code</label>
                <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Pay Period</label>
                <PayPeriod [selectedCompanyId]="selectedCompanyId" [payPeriodType]="payPeriodType"
                    (payperiodEmit)="handlePayperiodEvent($event)">
                </PayPeriod>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Input No</label>
                <select class="form-select form-select-sm" [(ngModel)]="InputNo">
                    <option *ngFor="let p of getInputNo" [value]="p.INPUT_NO">
                        {{ p.INPUT_NO }}
                    </option>
                </select>
            </div>
            <div class="col-md-2" style="padding-top: 25px;">
                <div class="d-flex gap-2">
                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-download"
                        matTooltip="ExportToExcel" (click)="exportToExcel()">
                        <mat-icon>download</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
<app-alertpopup *ngIf="showPopupalert" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="showPopupalert = false">
</app-alertpopup>
