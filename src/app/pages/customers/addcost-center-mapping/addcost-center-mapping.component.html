<form [formGroup]="costForm" novalidate>
    <mat-card class="custom-card">
        <mat-card-header class="sticky-header">
            <mat-card-title style="color: #302CB3;"> Add Cost Center Mapping </mat-card-title>
            <span class="spacer"></span>
            <button mat-icon-button (click)="onClose()" class="no-border-icon">
                <mat-icon>close</mat-icon>
            </button>
        </mat-card-header>

        <mat-card-content style="padding-top: 10px;">
            <div class="row g-3 mb-3">
                <div class="col-md-12">
                    <label class="form-label text-muted small mb-0" style="white-space: nowrap;">Map Name<span
                            style="color:red">*</span></label>
                    <div>
                        <input type="text" class="form-control form-control-sm" formControlName="mapName" />

                        <small class="text-danger d-block mt-1" *ngIf="showErrors && costForm.get('mapName')?.invalid">
                            Map Name is required
                        </small>
                    </div>

                    <!-- Company Code -->
                    <label class="form-label text-muted small" style="white-space: nowrap;">Company code<span
                            style="color:red">*</span></label>
                    <div>
                        <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>

                        <small class="text-danger d-block mt-1"
                            *ngIf="showErrors && costForm.get('companyCode')?.invalid">
                            Company Code is required
                        </small>
                    </div>

                    <!-- Company Name -->
                    <label class="form-label text-muted small mb-0" style="white-space: nowrap;">Cost Center<span
                            style="color:red">*</span></label>
                    <div>
                        <input type="text" class="form-control form-control-sm" formControlName="CostCenter" />

                        <small class="text-danger d-block mt-1"
                            *ngIf="showErrors && costForm.get('CostCenter')?.invalid">
                            Cost Center is required
                        </small>
                    </div>
                </div>
            </div>
        </mat-card-content>

        <!-- FOOTER BUTTONS -->
        <div class="d-flex justify-content-end mt-3">

            <div class="btn-1"
                style="display: flex; justify-content: flex-end; gap: 10px; width: 100%; padding-right: 7px;">

                <button type="button" (click)="onCancel()" style="border: none; border-radius: 7px; width: 80px; height: 30px;
                           cursor: pointer; background-color: #f0f0f0; color: black;">
                    Cancel
                </button>

                <button type="button" (click)="saveCostCenter()" style="border: none; border-radius: 7px; width: 80px; height: 30px;
               cursor: pointer; background-color: blue; color: white;">
                    Save
                </button>
            </div>
        </div>
    </mat-card>
</form>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets\Loading.gif" alt="Loading...">
</div>
<app-alertpopup *ngIf="showPopupalert" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="showPopupalert = false">
</app-alertpopup>
