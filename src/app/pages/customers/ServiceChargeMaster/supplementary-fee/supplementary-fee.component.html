<div class="col-md-4 same-col">
    <label class="form-label text-muted small">Supplementary Fee</label>

    <select class="form-select form-select-sm" [(ngModel)]="selectedSupplementary" (change)="onSupplementaryChange()">

        <option value="">Select</option>

        <option *ngFor="let type of supplementaryTypes" [value]="type.Service_Charge_Type_Id">
            {{ type.Service_Charge_Type_Name }}
        </option>

    </select>
</div>
