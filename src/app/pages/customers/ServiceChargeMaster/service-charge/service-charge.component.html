<br />
<div class="page-wrapper">
    <div class="scrollable-content">

        <div style="color: #302CB3; font-size: 22px; font-family: Nunito Sans; font-weight: 700; min-width: 960px">
            Service Charge
        </div>

        <div class="container py-4">

            <!-- ⭐ NOW EVERYTHING IS IN ONE SINGLE ROW ⭐ -->
            <div class="row g-3 align-items-end">

                <!-- Company Code -->
                <div class="col-md-3">
                    <label class="form-label text-muted small">Company code</label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">Service Charge Master</label>
                    <select class="form-select form-select-sm" (change)="onServiceChargeChange($event)">
                        <option value="">Select</option>
                        <option *ngFor="let servicecharge of servicechargedata"
                            [value]="servicecharge.Service_Charge_Master_Id">
                            {{servicecharge.Service_Charge_Master_Name}}
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label text-muted small">Service Charge Type</label>
                    <select class="form-select form-select-sm" (change)="onServiceChargeTypeChange($event)">
                        <option value="">Select</option>
                        <option *ngFor="let servicechargetype of servicechargetypedata"
                            [value]="servicechargetype.Service_Charge_Type_Id">
                            {{servicechargetype.Service_Charge_Type_Name}}
                        </option>
                    </select>

                </div>

                <br />
                <br />
                <!-- Buttons Section -->
                <div class="col-md-9 d-flex gap-2">
                    <!-- <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Search"
                        (click)="onSearchClick()">
                        <mat-icon>search</mat-icon>
                    </button> -->

                    <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Search"
                    (click)="onSearchClick()">
                        <mat-icon>search</mat-icon>
                    </button>

                    <button class="btn btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="export to excel">
                        <mat-icon>table_chart</mat-icon>
                    </button>

                    <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Import"
                        (click)="ImportClick(fileInput)">
                        <mat-icon>cloud_upload</mat-icon>
                    </button>

                    <input type="file" #fileInput style="display: none;" (click)="fileInput.value=''"
                        (change)="onFileChange($event)" accept=".xlsx, .xls" />

                    <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Template">
                        <mat-icon>cloud_download</mat-icon>
                    </button>

                    <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Add"
                        (click)="AddPOOpen()">
                        <mat-icon>add</mat-icon>
                    </button>

                </div>

            </div>
        </div>

    </div>
</div>
   <div *ngIf="showPopup" class="overlay">
        <app-alertpopup *ngIf="showPopup" [message]="popupMessage" class="centered-popup"
            (close)="showPopup = false"></app-alertpopup>
    </div>
