<form [formGroup]="ITcalenderform" novaildate>
    <mat-card class="custom-card">
        <mat-card-header class="sticky-header">
            <br />
            <!-- <div
                style="color: #302CB3; font-size: 22px; font-family: Nunito Sans; font-weight: 700;  padding-right: 380px;">
                Add IT Calender</div> -->
            <mat-card-title style="color: #302CB3;">Edit IT Calender</mat-card-title>


            <span class="spacer"></span>
            <button mat-icon-button (click)="onClose()" class="no-border-icon">
                <mat-icon>close</mat-icon>
            </button>

        </mat-card-header>

        <mat-card-content>
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <label class="form-label text-muted small">
                        Company Code <span style="color:red">*</span>
                    </label>

                    <input class="form-control form-control-sm" formControlName="companycode">
                </div>


                <div class="col-md-6">
                    <label class="form-label text-muted small">Financial Year<span style="color:red">*</span></label>
                    <input class="form-control form-control-sm" formControlName="Financialyear">
                </div>

            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label text-muted small">Declaration Cut-off Date<span
                            style="color:red">*</span></label>
                    <input class="form-control form-control-sm" type="date" formControlName="declarationdate">
                    <small
                        *ngIf="ITcalenderform.get('declarationdate')?.touched && ITcalenderform.get('declarationdate')?.hasError('required')"
                        style="color: red;">
                        Declaration Cut-off Date is required
                    </small>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small">Submission Cut-off Date<span
                            style="color:red">*</span></label>
                    <input class="form-control form-control-sm" type="date" formControlName="submisiondate">
                    <small
                        *ngIf="ITcalenderform.get('submisiondate')?.touched && ITcalenderform.get('submisiondate')?.hasError('required')"
                        style="color: red;">
                        submisiondate is required
                    </small>
                </div>


            </div>
        </mat-card-content>

        <mat-card-footer class="footer">
            <div class="d-flex justify-content-end mt-3">
                <div class="btn-1"
                    style="display: flex; justify-content: flex-end; gap: 10px; width: 100%; padding-right: 7px;">

                    <button type="Cancel"
                        style="border: none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; background-color: #f0f0f0;">
                        Cancel
                    </button>

                    <button type="submit" (click)="Update()"
                        style="border: none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; background-color: blue; color: white;">
                        Update
                    </button>
                </div>
            </div>
        </mat-card-footer>
    </mat-card>
</form>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
<app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="closePopup()"></app-alertpopup>
