<form [formGroup]="clientaddress" novalidate>
  <mat-card class="custom-card">
    <mat-card-header class="sticky-header">
      <div
        style="color: #302CB3; font-size: 22px; font-family: Nunito Sans; font-weight: 700; padding-right: 580px;">
        Import
      </div>
      <span class="spacer"></span>
      <button mat-icon-button (click)="onClose()" class="no-border-icon">
        <mat-icon>close</mat-icon>
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label small">Import data to?</label>
          <select class="form-select form-select-sm" formControlName="importDataTo">
            <option value="" disabled selected>-Select-</option>
            <!-- Add options -->
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small">Import Type</label>
          <select class="form-select form-select-sm" formControlName="importType">
            <option value="" disabled selected>-Select-</option>
            <!-- Add options -->
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small">Fields to update</label>
        <textarea class="form-control form-control-sm" rows="3" formControlName="fieldsToUpdate"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label small">Browse file</label>
        <input type="file" class="form-control form-control-sm" formControlName="fileUpload" />
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
        <button type="button" class="btn btn-sm d-flex align-items-center" matTooltip="Download Template" style="padding: 4px 8px;">
          <mat-icon>cloud_download</mat-icon>
        </button>
      </div>

      <button type="submit" class="btn btn-primary">
        Next
      </button>
    </mat-card-content>
  </mat-card>
</form>
