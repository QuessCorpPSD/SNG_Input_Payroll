<div class="container-fluid">
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="card-body d-flex gap-2">
                <div class="col-md-3">
                <label class="form-label">Company Code</label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Site Name</label>
                    <groupname [selectedCompanyId]="companyId" (sitenameEmit)="groupnameEvent($event)">
                    </groupname>
                </div>
                <div class="col-md-3">
                    <div class="d-flex gap-2" style="padding-top: 32px;">
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search"
                            (click)="Searchclick()" matTooltip="Search">
                            <mat-icon>search</mat-icon>
                        </button>
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-add"
                            (click)="onMainAddClick()" matTooltip="Add">
                            <mat-icon>add</mat-icon>
                        </button>
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-download"
                            (click)="DownloadTemplate()" matTooltip="Template">
                            <mat-icon>cloud_download</mat-icon>
                        </button>
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-upload"
                            (click)="ImportClick(fileInput)" matTooltip="Upload">
                            <mat-icon>cloud_upload</mat-icon>
                        </button>
                        <button *ngIf="this.dataSource && this.dataSource.data && this.dataSource.data.length > 0"
                            class="btn btn-secondary btn-sm d-flex align-items-center justify-content-center"
                            (click)="ExportClick()" matTooltip="Excel Export" >
                            <mat-icon>table_chart</mat-icon>
                        </button>
                        <input type="file" #fileInput style="display: none;" (click)="fileInput.value=''"
                            (change)="onFileChange($event)" accept=".xlsx, .xls" />
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12" style="padding-left: 25px;" *ngIf="(dataSource?.data?.length || 0) > 0">
                <div class="table-wrapper">
                    <div class="table-scroll">
                        <table class="previewtable" mat-table [dataSource]="dataSource" matSort
                            class="custom-table mat-elevation-z8">
                            <!-- Dynamic Columns -->
                            <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>{{ column }}</mat-header-cell>
                                <mat-cell *matCellDef="let element"> {{ element[column] }} </mat-cell>
                            </ng-container>

                            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                            <mat-row *matRowDef="let row; columns: displayedColumns;"
                                (click)="onTopRowClick(row)"></mat-row>
                        </table>
                    </div>
                    <mat-paginator  [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template #popupTpl>
    <h2 mat-dialog-title class="d-flex justify-content-between align-items-center">
    <span>Holiday Master</span>
    <button mat-icon-button mat-dialog-close aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </h2>

    <mat-dialog-content class="mat-typography">
        <!-- your exact div goes here -->
        <div>
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label text-muted small">Company Code</label>
                    <ng-container *ngIf="isNew; else existingCompany">
                        <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                    </ng-container>
                    <ng-template #existingCompany>
                        <label class="form-control" style="font-size: 11px;">{{ selectedrowCompanyCode }}</label>
                    </ng-template>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted small">Site Name</label>
                    <ng-container *ngIf="isNew; else existingSite">
                        <groupname [selectedCompanyId]="companyId" (sitenameEmit)="groupnameEvent($event)">
                        </groupname>
                    </ng-container>
                    <ng-template #existingSite>
                        <label class="form-control" style="font-size: 11px;">{{ selectedrowSiteName }}</label>
                    </ng-template>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted small">State</label>
                    <ng-container *ngIf="isNew; else existingState">
                        <state (stateEmit)="stateEvent($event)"></state>
                    </ng-container>
                    <ng-template #existingState>
                        <label class="form-control" style="font-size: 11px;">{{ selectedrowState }}</label>
                    </ng-template>
                </div>
            </div>

            <div class="row" style="padding-top: 1rem;">
                <div class="col-md-4">
                    <label class="form-label text-muted small d-block">From Date</label>
                    <ng-container *ngIf="isNew; else existingFromDate">
                        <input type="date" class="form-control" [(ngModel)]="selectedFromdate"
                        style="font-size: 11px;">
                    </ng-container>
                    <ng-template #existingFromDate>
                        <label class="form-control" style="font-size: 11px;">
                            {{ selectedrowFromdate | date:'dd/MM/yyyy' }}
                        </label>
                    </ng-template>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted small d-block">To Date</label>
                    <ng-container *ngIf="isNew; else existingToDate">
                        <input type="date" class="form-control" [(ngModel)]="selectedTodate"
                        style="font-size: 11px;">
                    </ng-container>
                    <ng-template #existingToDate>
                        <label class="form-control" style="font-size: 11px;">
                            {{ selectedrowTodate | date:'dd/MM/yyyy' }}
                        </label>
                    </ng-template>
                </div>
            </div>

            <br />
            <div>
                <form [formGroup]="holidayForm">
                    <table class="table table-bordered w-100" style="font-size: 11px;">
                        <thead>
                            <tr>
                                <th>Sl. No</th>
                                <th>DATE</th>
                                <th>HOLIDAY TYPE</th>
                                <th>HOLIDAY DESCRIPTION</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody formArrayName="holidays">
                            <tr *ngFor="let row of holidays.controls; let i = index" [formGroupName]="i">
                                <td>{{ i + 1 }}</td>
                                <td><input type="date" formControlName="date" class="form-control" style="font-size: 11px;"/></td>
                                <td>
                                    <select formControlName="type" class="form-control" style="font-size: 11px;">
                                        <option value="NH">NH</option>
                                        <option value="H">H</option>
                                        <option value="WO">WO</option>
                                    </select>
                                </td>
                                <td><input type="text" formControlName="description" class="form-control" style="font-size: 11px;"/></td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-add" *ngIf="!row.value.isSaved" (click)="addRow(i)"
                                        [disabled]="row.invalid">
                                        <mat-icon>add</mat-icon>
                                    </button>
                                    <button class="btn btn-sm btn-delete" *ngIf="row.value.isSaved"
                                        (click)="deleteRow(i)">
                                        <mat-icon>delete</mat-icon>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </form>
            </div>
            <div *ngIf="isNew" class="row mt-3">
                <div class="col-md-5"></div>
                <div class="col-md-1">
                    <button *ngIf="isNew" class="btn btn-success" (click)="Saveclick()">Save</button>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-secondary" mat-dialog-close>Close</button>
                </div>
                <div class="col-md-5"></div>
            </div>
            <div *ngIf="!isNew" class="row mt-3">
                <div class="col-md-4"></div>
                <div class="col-md-4" style="display: flex;gap: 10px;align-items: center;">
                    <button class="btn btn-success" (click)="Updateclick()">Update</button>
                    <button class="btn btn-danger" (click)="Deleteclick()">Delete All</button>
                    <button class="btn btn-secondary" mat-dialog-close>Close</button>
                </div>
                <div class="col-md-4"></div>
            </div>
        </div>
    </mat-dialog-content>
</ng-template>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
<div *ngIf="showPopup" class="overlay"></div>
<app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="showPopup = false"></app-alertpopup>
