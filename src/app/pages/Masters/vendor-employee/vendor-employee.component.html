<div class="container-fluid">
    <div class="card-body g-2">
        <br />
        <form>
            <div class="row g-2 align-items-end ">

                <div class="col-md-3">
                    <label class="form-label">Company Code</label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Site Name</label>
                    <groupname [selectedCompanyId]="companyId" (sitenameEmit)="groupnameEvent($event)">
                    </groupname>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Employee Code</label>
                    <input type="number" id="employeeCode"  class="w-100 custom-height rounded-1 select-drop"
                appearance="outline" style="background-color: white;height:30px;"
                        placeholder="Enter Employee Code" [(ngModel)]="employeecode" name="employeeCode" />
                </div>

                <div class="col-md-2">
                    <label for="eActive" class="form-label">EActive</label>
                    <select id="eActive" class="w-100 custom-height rounded-1 select-drop"
                appearance="outline" style="background-color: white;height:30px;" [(ngModel)]="Eactive" name="eActive">
                        <option value="ALL">ALL</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="col-md-3" style="padding-top: 27px;">
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search"
                            matTooltip="Search" (click)="searchVendorEmployee()">
                            <mat-icon>search</mat-icon>
                        </button>

                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-download"
                            matTooltip="Template" (click)="DownloadTemplate()">
                            <mat-icon>cloud_download</mat-icon>
                        </button>
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-upload"
                            matTooltip="Upload" (click)="ImportClick(fileInput)">
                            <mat-icon>cloud_upload</mat-icon>
                        </button>
                        <input type="file" #fileInput style="display: none;" (click)="fileInput.value=''"
                            (change)="onFileChange($event)" accept=".xlsx, .xls" />
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>

<div class="mt-4" *ngIf="hasSearchResults">
<div class="table-container">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 mat-table">

    <!-- Your columns -->
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        {{ getReadableColumnName(column) }}
      </th>
      <td mat-cell *matCellDef="let element">
        {{ element[column] }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
