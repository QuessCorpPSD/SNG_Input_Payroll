<form [formGroup]="POAddForm" novalidate>
  <mat-card class="custom-card">
    <mat-card-header class="sticky-header">
      <mat-card-title><mat-icon>person</mat-icon> Employee PO</mat-card-title>
      <span class="spacer"></span>
      <button mat-icon-button (click)="onClose()" class="no-border-icon">
        <mat-icon>close</mat-icon>
      </button>
      <br />
    </mat-card-header>

    <mat-card-content class="scroll-content">
      <br />

      <!-- Row 1 -->
      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label">Company Code</label>
          <input type="text" class="form-control form-control-sm" formControlName="CompanyCode">

          <!-- <CompanyPicker [selectedCompanyCode]="selectedCompanyCode" formControlName="CompanyCode"
            (companyEmit)="handleCompanyEvent($event)">
          </CompanyPicker> -->

          <!-- <CompanyPicker id="companyCode1" formControlName="CompanyCode"
          (companyEmit)="handleCompanyEvent($event)"></CompanyPicker>
          <div *ngIf="POAddForm.get('CompanyCode')?.touched && POAddForm.get('CompanyCode')?.hasError('required')"
            class="text-danger small">
            Company Code is required
          </div> -->

        </div>

        <div class="col-md-4">
          <label class="form-label">PO No</label>
          <ng-container *ngIf="statusId === 0">
            <ponumbersearch [comapnyId]="comapnyId" (ponumbersearchEmit)="handleponumbersearchEvent($event)">
            </ponumbersearch>
          </ng-container>
          <ng-container *ngIf="statusId === 3">
            <input type="text" class="form-control form-control-sm" formControlName="PONo"
              placeholder="Enter PO number">

          </ng-container>


        </div>
        <div class="col-md-4">
          <label class="form-label">PO Start Date</label>
          <input type="date" class="form-control form-control-sm" formControlName="POStartDate"
            placeholder="Select Date">
        </div>
      </div>

      <!-- Row 2 -->
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label">PO End Date</label>
          <input type="date" class="form-control form-control-sm" formControlName="POEndDate">
        </div>
        <div class="col-md-4">
          <label class="form-label">PO Total Value</label>
          <input type="number" class="form-control form-control-sm" formControlName="POtotalvalue">
        </div>
        <div class="col-md-4">
          <label class="form-label">Start Date</label>
          <input type="date" class="form-control form-control-sm" formControlName="StartDate">
        </div>

      </div>

      <!-- Row 3 -->
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label">End Date</label>
          <input type="date" class="form-control form-control-sm" formControlName="EndDate">
        </div>

        <div class="col-md-4">
          <label class="form-label">Duration</label>
          <input type="text" class="form-control form-control-sm" formControlName="Duration">
        </div>
        <div class="col-md-4">
          <label class="form-label text-muted small">Item Type</label>
          <!-- <app-poitemtype (itemTypeEmit)="ItemTypeEvent($event)"></app-poitemtype> -->
        </div>

      </div>
      <!-- Below your existing date rows -->
      <div class="row g-3 mt-1" *ngIf="showExtensionInput">
        <div class="col-md-4">
          <label class="form-label">Extension End Date</label>
          <input type="date" class="form-control form-control-sm" formControlName="ExtensionEndDate"
            placeholder="Select Extension End Date" />
        </div>
      </div>

      <!-- Row 4 -->
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label">Employee ID</label>
          <input type="number" class="form-control form-control-sm" formControlName="EmployeeID">
        </div>
        <div class="col-md-4">
          <label class="form-label">Employee Name</label>
          <input type="text" class="form-control form-control-sm" formControlName="EmployeeName">
        </div>
        <div class="col-md-4">
          <label class="form-label">Client Emp No</label>
          <input type="number" class="form-control form-control-sm" formControlName="ClientEmpNo">
        </div>



      </div>

      <!-- Row 5 -->
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label">Offer PO Value</label>
          <input type="text" class="form-control form-control-sm" formControlName="OfferPOValue">
        </div>
        <div class="col-md-4">
          <label class="form-label">Quantity Type</label>
          <select class="form-select form-select-sm" formControlName="Quantitytype">
            <option value="">-- Select --</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Quantity</label>
          <input type="text" class="form-control form-control-sm" formControlName="Quantity">
        </div>


      </div>

      <!-- Row 6 -->
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label">CTC</label>
          <input type="text" class="form-control form-control-sm" formControlName="CTC">
        </div>
        <div class="col-md-4">
          <label class="form-label">Service Charge %</label>
          <input type="text" class="form-control form-control-sm" formControlName="ServiceCharge">
        </div>
        <div class="col-md-4">
          <label class="form-label">PO Rate</label>
          <input type="text" class="form-control form-control-sm" formControlName="PoRate">
        </div>

      </div>
      <!-- Row 7 -->
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label">Balance Amount</label>
          <input type="text" class="form-control form-control-sm" formControlName="BalanceAmount">
        </div>
        <div class="col-md-4">
          <label class="form-label">Monthly Rate</label>
          <input type="text" class="form-control form-control-sm" formControlName="MonthlyRate">
        </div>
        <div class="col-md-4">
          <label class="form-label">Resource Value</label>
          <input type="text" class="form-control form-control-sm" formControlName="ResourceValue">
        </div>
      </div>
    </mat-card-content>

    <mat-card-footer>
      <div class="row mt-4">
        <div class="col-12 d-flex justify-content-end">
          <ng-container *ngIf="statusId === 3">
            <button style="border:none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; gap: 10px" (click)="toggleExtensionInput()">
              Extension
            </button>
            <button style="border:none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; gap: 10px" (click)="onRevised()">
              Revised
            </button>
          </ng-container>


          <button type="reset"  style="border:none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; gap: 10px">Reset</button>
          <button type="submit" class="btn-primary" style="border:none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; gap: 10px">Save</button>
        </div>
      </div>
    </mat-card-footer>
  </mat-card>
</form>
