<form [formGroup]="addProfessionalTax" novalidate>
    <mat-card class="custom-card">
        <mat-card-header class="sticky-header">
            <mat-card-title>
                {{ Edit ? 'Edit Professional Tax' : 'Add Professional Tax' }}
            </mat-card-title>

            <span class="spacer"></span>
            <button mat-icon-button (click)="onClose()" class="no-border-icon">
                <mat-icon>close</mat-icon>
            </button>
        </mat-card-header>

        <mat-card-content class="scroll-content">
            <br />
            <!-- Row 1 -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">State Name<span class="text-danger">*</span></label>
                    <!-- <input type="text" class="form-control" formControlName="POform" /> -->
                    <select class="form-select" formControlName="StateName">
                        <option value="">-- Select --</option>
                        <option *ngFor="let pay of state" [value]="pay.stateId">{{pay.stateName}}</option>
                    </select>
                    <div class="text-danger small" *ngIf="addProfessionalTax.get('StateName')?.touched 
             && addProfessionalTax.get('StateName')?.hasError('required')">
                        StateName is required
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Effective Date<span class="text-danger">*</span></label>
                    <input type="date" class="form-control" formControlName="EffectiveDate" />
                    <div class="text-danger small" *ngIf="addProfessionalTax.get('EffectiveDate')?.touched 
             && addProfessionalTax.get('EffectiveDate')?.hasError('required')">
                        EffectiveDate is required
                    </div>
                    <!-- <select class="form-select" formControlName="POform">
                        <option value="">-- Select --</option>
                        <option *ngFor="let PONo of PONumber" [value]="PONo.poid">{{PONo.ponumber}}</option>
                    </select> -->
                </div>
                <div class="col-md-4">
                    <label class="form-label">PT Type<span class="text-danger">*</span></label>
                    <select class="form-select" formControlName="PTType" [disabled]="Edit">
                        <option value="">-- Select --</option>
                        <option *ngFor="let pay of ptType" [value]="pay.pT_Type_Id">{{pay.pT_Type_Name}}</option>
                    </select>
                    <div class="text-danger small" *ngIf="addProfessionalTax.get('PTType')?.touched 
             && addProfessionalTax.get('PTType')?.hasError('required')">
                        PTType is required
                    </div>
                    <!-- <input type="text" class="form-control" formControlName="PODate" /> -->
                </div>
            </div>
            <!-- Row 2 -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Category<span class="text-danger">*</span></label>
                    <select class="form-select" formControlName="Category">
                        <option value="">-- Select --</option>
                        <option *ngFor="let pay of category" [value]="pay.category_Id">{{pay.category_Name}}</option>
                    </select>
                    <div class="text-danger small" *ngIf="addProfessionalTax.get('Category')?.touched 
             && addProfessionalTax.get('Category')?.hasError('required')">
                        Category is required
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Circle<span class="text-danger"></span></label>
                    <select class="form-select" formControlName="Circle">
                        <option value="">-- Select --</option>
                        <option *ngFor="let pay of circle" [value]="pay.ptCircle_Id">{{pay.ptCircle_Name}}</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Month<span class="text-danger">*</span></label>
                    <select class="form-select" formControlName="Month">
                        <option value="0">All</option>
                        <option *ngFor="let pay of month" [value]="pay.month_Id">{{pay.month_Name}}</option>
                    </select>
                    <div class="text-danger small" *ngIf="addProfessionalTax.get('Month')?.touched 
             && addProfessionalTax.get('Month')?.hasError('required')">
                        Month is required
                    </div>
                </div>
            </div>
            <!-- Row 3 -->
            <div class="col-md-3 d-flex gap-2">
                <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Add"
                    (click)="addNewRow()">
                    <mat-icon>add</mat-icon>
                </button>
                <!-- <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Edit">
                    <mat-icon>edit</mat-icon>
                </button> -->
                <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Delete"
                    (click)="deleteSelectedRow()">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
            <div class="mt-3">
                <!-- Table wrapper for horizontal scroll -->
                <div class="table-container">

                    <mat-table [dataSource]="uploadedDataSource" class="mat-elevation-z8">

                        <!-- Sl No -->
                        <ng-container matColumnDef="slNo">
                            <mat-header-cell *matHeaderCellDef> Sl. No. </mat-header-cell>
                            <mat-cell *matCellDef="let row; columns: ['slNo','fromValue','toValue','amount'];"
                                [class.selected]="row.slNo === selectedRowSlNo" (click)="selectedRowSlNo = row.slNo">
                                {{ row.slNo }}
                            </mat-cell>
                        </ng-container>

                        <!-- From Value -->
                        <ng-container matColumnDef="fromValue">
                            <mat-header-cell *matHeaderCellDef> From Value </mat-header-cell>
                            <mat-cell *matCellDef="let element">
                                <input type="number" class="form-control" [(ngModel)]="element.fromValue"
                                    [ngModelOptions]="{ standalone: true }" name="fromValue{{element.slNo}}" />
                            </mat-cell>
                        </ng-container>

                        <!-- To Value -->
                        <ng-container matColumnDef="toValue">
                            <mat-header-cell *matHeaderCellDef> To Value </mat-header-cell>
                            <mat-cell *matCellDef="let element">
                                <input type="number" class="form-control" [(ngModel)]="element.toValue"
                                    [ngModelOptions]="{ standalone: true }" name="toValue{{element.slNo}}" />
                            </mat-cell>
                        </ng-container>

                        <!-- Amount -->
                        <ng-container matColumnDef="amount">
                            <mat-header-cell *matHeaderCellDef> Amount </mat-header-cell>
                            <mat-cell *matCellDef="let element">
                                <input type="number" class="form-control" [(ngModel)]="element.amount"
                                    [ngModelOptions]="{ standalone: true }" name="amount{{element.slNo}}" />
                            </mat-cell>
                        </ng-container>

                        <mat-header-row *matHeaderRowDef="['slNo','fromValue','toValue','amount']"></mat-header-row>
                        <mat-row *matRowDef="let row; columns: ['slNo','fromValue','toValue','amount'];"></mat-row>

                    </mat-table>

                </div>
            </div>
        </mat-card-content>
        <mat-card-footer class="footer">
            <div class="d-flex justify-content-end mt-3">
                <div class="btn-1"
                    style="display: flex; justify-content: flex-end; gap: 10px; width: 100%; padding-right: 7px;">

                    <button type="Cancel"
                        style="border: none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; background-color: #f0f0f0; color: black;"
                        (click)="onClose()">
                        Cancel
                    </button>

                    <button type="submit" style="border: none; border-radius: 7px; width: 80px; height: 30px;
               cursor: pointer; background-color: blue; color: white;"
                        (click)="Edit ? updateProfessionalTax() : saveProfessionalTax()">
                        {{ Edit ? 'Update' : 'Save' }}
                    </button>
                </div>
            </div>
        </mat-card-footer>
    </mat-card>
</form>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
