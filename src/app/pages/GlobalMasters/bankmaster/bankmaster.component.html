<br />
<div style="color: #302CB3; font-size: 22px; font-family: Nunito Sans; font-weight: 700; min-width: 960px">
    Bank Details
</div>

<div class="container py-2">
    <div class="row g-3 align-items-end">
        <div class="col-md-3">
            <label class="form-label text-muted small">Bank Name</label>
            <input type="text" class="form-control form-control-sm" [(ngModel)]="bankName" name="bankName" />

        </div>
        <div class="col-md-2 d-flex gap-2">
            <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Search"
                (click)="onsearch()">
                <mat-icon>search</mat-icon>
            </button>
            <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="export to excel"
                (click)="exportToExcel()">
                <mat-icon>table_chart</mat-icon>
            </button>
            <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Add"
                (click)="AddBankOpen()">
                <mat-icon>add</mat-icon>
            </button>

        </div>
    </div>
</div>
<br />
<div class="table-wrapper1" style="min-width: 960px;" *ngIf="showTable">
    <div class="table-scroll">
        <mat-table [dataSource]="uploadedDataSource" matSort class="custom-table mat-elevation-z8 auto-fit-table">

            <!-- 🔹 Action Column -->
            <ng-container matColumnDef="Action">
                <mat-header-cell *matHeaderCellDef class="Action"><strong>Action</strong></mat-header-cell>
                <mat-cell *matCellDef="let row" class="Action">
                    <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Edit"
                        (click)="openEdit(row)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Delete"
                        (click)="DeleteBankMaster(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="Bank_Id" style="display: none;">
                <mat-header-cell *matHeaderCellDef><strong>Bank_Id</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Bank_Id }}</mat-cell>
            </ng-container>

            <!-- 🔹 Sl.No -->
            <ng-container matColumnDef="slNo">
                <mat-header-cell *matHeaderCellDef class="SNo"><strong>Sl.No</strong></mat-header-cell>
                <mat-cell *matCellDef="let row" class="SNo">{{ row.Serial_No }}</mat-cell>
            </ng-container>

            <!-- 🔹 Bank Name -->
            <ng-container matColumnDef="bankname">
                <mat-header-cell *matHeaderCellDef><strong>Bank Name</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Bank_Name }}</mat-cell>
            </ng-container>

            <!-- 🔹 Digit Length Condition -->
            <ng-container matColumnDef="digitlengthcondition">
                <mat-header-cell *matHeaderCellDef><strong>Digit Length Condition</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Digit_Length_Condition }}</mat-cell>
            </ng-container>

            <!-- 🔹 Bank A/C Digit -->
            <ng-container matColumnDef="bankacdigit">
                <mat-header-cell *matHeaderCellDef><strong>Bank A/C Digit</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Bank_Account_Number_Digits }}</mat-cell>
            </ng-container>

            <!-- 🔹 IFSC Treatment -->
            <ng-container matColumnDef="ifsctreatment">
                <mat-header-cell *matHeaderCellDef><strong>IFSC Treatment</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.IFSC_Treatment }}</mat-cell>
            </ng-container>



            <mat-header-row *matHeaderRowDef="uploadDisplayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: uploadDisplayedColumns"></mat-row>
        </mat-table>
    </div>

    <!-- No data message -->
    <div *ngIf="uploadedDataSource.data.length === 0" class="text-center p-4">
        <p class="text-muted">No data to display</p>
    </div>

    <mat-paginator [length]="uploadedDataSource.data.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons aria-label="Select page">
    </mat-paginator>
</div>
