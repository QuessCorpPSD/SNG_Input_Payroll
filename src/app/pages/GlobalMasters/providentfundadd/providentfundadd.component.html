<form [formGroup]="addProvidentForm" novalidate>
    <mat-card class="custom-card">
        <mat-card-header class="sticky-header">
            <mat-card-title> {{ Edit ? 'Edit Provident Fund' : 'Add Provident Fund' }}</mat-card-title>
            <span class="spacer"></span>
            <button mat-icon-button (click)="onClose()" class="no-border-icon">
                <mat-icon>close</mat-icon>
            </button>
        </mat-card-header>

        <mat-card-content class="scroll-content">
            <!-- Row 1 -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Pay Code<span class="text-danger">*</span></label>
                    <!-- <input type="text" class="form-control" formControlName="POform" /> -->
                    <select class="form-select" formControlName="PayCode">
                        <option value="">-- Select --</option>
                        <option *ngFor="let pay of getPay" [value]="pay.paycode_Id">{{pay.paycode_Code}}</option>
                    </select>
                    <div class="text-danger small" *ngIf="addProvidentForm.get('PayCode')?.touched 
             && addProvidentForm.get('PayCode')?.hasError('required')">
                        PayCode is required
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Description<span class="text-danger"></span></label>
                    <input type="text" class="form-control" formControlName="Description" />

                    <!-- <select class="form-select" formControlName="POform">
                        <option value="">-- Select --</option>
                        <option *ngFor="let PONo of PONumber" [value]="PONo.poid">{{PONo.ponumber}}</option>
                    </select> -->
                </div>
                <div class="col-md-4">
                    <label class="form-label">Print As<span class="text-danger"></span></label>
                    <input type="text" class="form-control" formControlName="PrintAs" />
                </div>
            </div>
            <!-- Row 2 -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Cap/Non Cap Type<span class="text-danger">*</span></label>
                    <select class="form-select" formControlName="CapNonCapType">
                        <option value="">-- Select --</option>
                        <option *ngFor="let pay of getCap" [value]="pay.cap_Type_Id">{{pay.cap_Type_Name}}</option>
                    </select>
                    <div class="text-danger small" *ngIf="addProvidentForm.get('CapNonCapType')?.touched 
             && addProvidentForm.get('CapNonCapType')?.hasError('required')">
                        CapNonCapType is required
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date<span class="text-danger"></span></label>
                    <input type="date" class="form-control" formControlName="Date" />
                </div>
            </div>
            <!-- Row 3 -->
            <div class="col-md-3 d-flex gap-2">
                <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Add"
                    (click)="addNewRow()">
                    <mat-icon>add</mat-icon>
                </button>
                <!-- <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Edit">
                    <mat-icon>edit</mat-icon>
                </button> -->
                <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Delete"
                    (click)="deleteSelectedRow()">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
            <div class="mt-3">
                <!-- Table wrapper for horizontal scroll -->
                <div class="table-container">
                    <mat-table [dataSource]="uploadedDataSource" class="mat-elevation-z8">

                        <!-- Sl. No. Column -->
                        <ng-container matColumnDef="slNo">
                            <mat-header-cell *matHeaderCellDef> Sl. No. </mat-header-cell>
                            <mat-cell
                                *matCellDef="let row; columns: ['slNo', 'fromValue', 'toValue', 'criteriatype','criteria','formula'];"
                                [class.selected]="row.slNo === selectedRowSlNo" (click)="selectedRowSlNo = row.slNo">
                                {{ row.slNo }}
                            </mat-cell>
                        </ng-container>

                        <!-- From Value Column -->
                        <ng-container matColumnDef="fromValue">
                            <mat-header-cell *matHeaderCellDef> From Value </mat-header-cell>
                            <mat-cell *matCellDef="let element">
                                <input type="number" class="form-control" [(ngModel)]="element.fromValue"
                                    [ngModelOptions]="{ standalone: true }" name="fromValue{{ element.slNo }}" />
                            </mat-cell>
                        </ng-container>

                        <!-- To Value Column -->
                        <ng-container matColumnDef="toValue">
                            <mat-header-cell *matHeaderCellDef> To Value </mat-header-cell>
                            <mat-cell *matCellDef="let element">
                                <input type="number" class="form-control" [(ngModel)]="element.toValue"
                                    [ngModelOptions]="{ standalone: true }" name="toValue{{ element.slNo }}" />
                            </mat-cell>
                        </ng-container>

                        <!-- Amount Column -->
                        <ng-container matColumnDef="criteriatype">
                            <mat-header-cell *matHeaderCellDef> Criteria Type </mat-header-cell>
                            <mat-cell *matCellDef="let element">
                                <select class="form-select" [(ngModel)]="element.criteriatype"
                                    [ngModelOptions]="{ standalone: true }">

                                    <option value="">-- Select --</option>
                                    <option *ngFor="let pay of getCriteria" [value]="pay.criteria_Type_Id">
                                        {{ pay.criteria_Type_Name }}
                                    </option>
                                </select>

                                <!-- <input type="number" class="form-control" [(ngModel)]="element.criteriatype"
                                    [ngModelOptions]="{ standalone: true }" name="criteriatype{{ element.slNo }}" /> -->
                            </mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="criteria">
                            <mat-header-cell *matHeaderCellDef> Criteria</mat-header-cell>
                            <mat-cell *matCellDef="let element"> <input type="number" class="form-control"
                                    [(ngModel)]="element.criteria" [ngModelOptions]="{ standalone: true }"
                                    name="criteria{{ element.slNo }}" /></mat-cell>
                        </ng-container>

                        <ng-container matColumnDef="formula">
                            <mat-header-cell *matHeaderCellDef> Formula </mat-header-cell>
                            <mat-cell *matCellDef="let element">
                                <input type="text" class="form-control" [(ngModel)]="element.formula"
                                    [ngModelOptions]="{ standalone: true }" name="formula{{ element.slNo }}" />
                            </mat-cell>
                        </ng-container>


                        <!-- Header and Row Definitions -->
                        <mat-header-row
                            *matHeaderRowDef="['slNo', 'fromValue', 'toValue', 'criteriatype','criteria','formula']">
                        </mat-header-row>
                        <mat-row
                            *matRowDef="let row; columns: ['slNo', 'fromValue', 'toValue',  'criteriatype','criteria','formula'];">
                        </mat-row>
                    </mat-table>
                </div>
            </div>
        </mat-card-content>
        <mat-card-footer class="footer">
            <div class="d-flex justify-content-end mt-3">
                <div class="btn-1"
                    style="display: flex; justify-content: flex-end; gap: 10px; width: 100%; padding-right: 7px;">

                    <button type="Cancel"
                        style="border: none; border-radius: 7px; width: 80px; height: 30px; cursor: pointer; background-color: #f0f0f0; color: black;"
                        (click)="onClose()">
                        Cancel
                    </button>
                    <button type="submit" style="border: none; border-radius: 7px; width: 80px; height: 30px;
               cursor: pointer; background-color: blue; color: white;"
                        (click)="Edit ? updateProvidentFund() : saveProvidentFund()">
                        {{ Edit ? 'Update' : 'Save' }}
                    </button>
                </div>
            </div>
        </mat-card-footer>
    </mat-card>
</form>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
