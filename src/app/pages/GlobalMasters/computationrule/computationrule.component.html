<div style="color: #302CB3; font-size: 22px; font-family: Montserrat;font-weight: 700;">
    Computation Rule
</div>

<div class="container py-2">
    <div class="row g-3 align-items-end">
        <div class="col-md-3">
            <label class="form-label text-muted small">Financial Year</label>
            <!-- <input type="text" class="form-control form-control-sm" /> -->
            <select class="form-select form-select-sm" [(ngModel)]="FinancialYear">
                <option>Select</option>
                <option *ngFor="let pay of fYear" [value]="pay.Financial_Year_Id">{{pay.Financial_Year_Name}}
                </option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label text-muted small">Category Name</label>
            <input type="text" class="form-control form-control-sm" [(ngModel)]="CategoryName" />
        </div>
        <div class="col-md-3">
            <label class="form-label text-muted small">Tax Id</label>
            <input type="text" class="form-control form-control-sm" [(ngModel)]="TaxId" />
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search" matTooltip="Search"
                (click)="onsearch()">
                <mat-icon>search</mat-icon>
            </button>
            <button class="btn btn-secondary btn-sm d-flex align-items-center justify-content-center"
                matTooltip="export to excel" (click)="exportToExcel()">
                <mat-icon>download</mat-icon>
            </button>
            <button class="btn btn-sm d-flex align-items-center justify-content-center btn-add" matTooltip="Add"
                (click)="AddComputationOpen()">
                <mat-icon>add</mat-icon>
            </button>
            <button class="btn btn-sm d-flex align-items-center justify-content-center btn-copy" matTooltip="copy"
                (click)="CopyOpen()">
                <mat-icon>content_copy</mat-icon>
            </button>
        </div>
    </div>
</div>
<div class="d-flex align-items-center justify-content-end" style="padding-top: 10px; padding-right: 40px;"
    *ngIf="showTable">
    <!-- Search Box -->
    <div style="display: inline-flex; align-items: center;
                   border-radius: 10px;
               border: 1px solid #7E7E7E;
               width: 260px;
               height: 30px;
               background-color: white;
               padding: 0 10px;">
        <i style="margin-right: 6px; display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M8.30883 9.01596C7.539 9.63177 6.5625 10 5.5 10C3.01472 10 1 7.98528 1 5.5C1 3.01472 3.01472 1 5.5 1C7.98528 1 10 3.01472 10 5.5C10 6.56251 9.63176.53901 9.01594 8.30885L10.8535 10.1465C11.0488 10.3417 11.0488 10.6583 10.8535 10.8536C10.6583 11.0488 10.3417 11.0488 10.1464 10.8536L8.30883 9.01596ZM2 5.5C2 3.567 3.567 2 5.5 2C7.433 2 9 3.567 9 5.5C9 6.44299 8.62707 7.29888 8.02066 7.92823C8.00355 7.94139 7.98711 7.95579 7.97144 7.97146C7.95578 7.98712 7.94137 8.00357 7.92822 8.02067C7.29887 8.62708 6.44299 9 5.5 9C3.567 9 2 7.433 2 5.5Z"
                    fill="#7E7E7E" />
            </svg>
        </i>
        <input type="text" [(ngModel)]="searchText" (keyup)="applyFilters()" placeholder="Search" style="border: none; outline: none; width: 100%;
                   font-size: 12px; background-color: transparent;" />
    </div>
</div>

<div class="table-wrapper1" *ngIf="showTable">
    <div class="table-scroll">
        <mat-table [dataSource]="dataSource" class="mat-elevation-z8 custom-table">

            <!-- 🔹 Action Column -->
            <ng-container matColumnDef="Action">
                <mat-header-cell *matHeaderCellDef><strong>Action</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">
                    <div class="action-wrapper">
                        <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Edit"
                            (click)="editOpen(row)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Delete"
                            (click)="deleteComputationRule(row)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                </mat-cell>
            </ng-container>

            <!-- 🔹 Sl.No -->
            <ng-container matColumnDef="slNo">
                <mat-header-cell *matHeaderCellDef><strong>Sl.No</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.SNo }}</mat-cell>
            </ng-container>

            <!-- 🔹 Financial Year -->
            <ng-container matColumnDef="financialyear">
                <mat-header-cell *matHeaderCellDef><strong>Financial Year</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Financial_Year_Name }}</mat-cell>
            </ng-container>

            <!-- 🔹 Effective Date -->
            <ng-container matColumnDef="effectivedate">
                <mat-header-cell *matHeaderCellDef><strong>Effective Date</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Effective_Date | date:'dd-MM-yyyy' }}</mat-cell>
            </ng-container>

            <!-- 🔹 Tax Id -->
            <ng-container matColumnDef="taxid">
                <mat-header-cell *matHeaderCellDef><strong>Tax Id</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Tax_Id }}</mat-cell>
            </ng-container>

            <!-- 🔹 Description -->
            <ng-container matColumnDef="description">
                <mat-header-cell *matHeaderCellDef><strong>Description</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Description }}</mat-cell>
            </ng-container>

            <!-- 🔹 Category Name -->
            <ng-container matColumnDef="categoryname">
                <mat-header-cell *matHeaderCellDef><strong>Category Name</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Category }}</mat-cell>
            </ng-container>

            <!-- 🔹 Rule -->
            <ng-container matColumnDef="rule">
                <mat-header-cell *matHeaderCellDef><strong>Rule</strong></mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.Computation_Rule }}</mat-cell>
            </ng-container>

            <!-- Header Rows -->
            <mat-header-row *matHeaderRowDef="uploadDisplayedColumns"></mat-header-row>

            <!-- Data Rows -->
            <mat-row *matRowDef="let row; columns: uploadDisplayedColumns" (click)="onRowClick(row)"
                [class.selected-row]="row === selectedRow"></mat-row>

        </mat-table>
    </div>
    <div *ngIf="dataSource.data.length === 0" class="text-center p-4">
        <p class="text-muted">No data to display</p>
    </div>
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>
