<form [formGroup]="AddPayTransactionForm" novalidate>
    <mat-card class="custom-card">
        <mat-card-header class="sticky-header">
            <mat-card-title>Add Pay Transaction</mat-card-title>
            <span class="spacer"></span>
            <button mat-icon-button (click)="onClose()" class="no-border-icon">
                <mat-icon>close</mat-icon>
            </button>
        </mat-card-header>

        <mat-card-content class="scroll-content">
            <br />
            <!-- Row 1 -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Company Code<span class="text-danger">*</span></label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                    <!-- <input type="text" class="form-control" formControlName="POform" /> -->
                    <!-- <select class="form-select" formControlName="CompanyCode">
                        <option value="">-- Select --</option>
                    </select> -->
                </div>
                <div class="col-md-4">
                    <label class="form-label">Pay Seq No<span class="text-danger">*</span></label>
                    <!-- <input type="date" class="form-control" formControlName="PaySeqNo" /> -->
                    <select class="form-select" formControlName="PaySeqNo">
                        <option value="">-- Select --</option>
                    </select>

                    <!-- <select class="form-select" formControlName="POform">
                        <option value="">-- Select --</option>
                        <option *ngFor="let PONo of PONumber" [value]="PONo.poid">{{PONo.ponumber}}</option>
                    </select> -->
                </div>
                <div class="col-md-4">
                    <label class="form-label">Pay Period<span class="text-danger"></span></label>
                    <select class="form-select" formControlName="PayPeriod">
                        <option value="">-- Select --</option>
                    </select>
                    <!-- <input type="text" class="form-control" formControlName="PODate" /> -->
                </div>
            </div>
            <!-- Row 2 -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Pay Code<span class="text-danger">*</span></label>
                    <select class="form-select" formControlName="PayCode">
                        <option value="">-- Select --</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Pay Category<span class="text-danger">*</span></label>
                    <select class="form-select" formControlName="PayCategory">
                        <option value="">-- Select --</option>
                    </select>
                </div>
            </div>
            <!-- Row 3 -->
            <div class="col-md-3 d-flex gap-2">
                <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Add">
                    <mat-icon>add</mat-icon>
                </button>
                <!-- <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Edit">
                    <mat-icon>edit</mat-icon>
                </button> -->
                <button class="btn  btn-sm d-flex align-items-center justify-content-center" matTooltip="Delete">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
            <div class="mt-3">
                <!-- Table wrapper for horizontal scroll -->
                <div class="table-container">
                    <mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

                        <!-- Sl. No. Column -->
                        <ng-container matColumnDef="slNo">
                            <mat-header-cell *matHeaderCellDef> Sl. No. </mat-header-cell>
                            <mat-cell *matCellDef="let element"> {{ element.slNo }} </mat-cell>
                        </ng-container>

                        <!-- From Value Column -->
                        <ng-container matColumnDef="EmployeeCode">
                            <mat-header-cell *matHeaderCellDef>Employee Code </mat-header-cell>
                            <mat-cell *matCellDef="let element"> {{ element.EmployeeCode }} </mat-cell>
                        </ng-container>

                        <!-- To Value Column -->
                        <ng-container matColumnDef="EmployeeName">
                            <mat-header-cell *matHeaderCellDef> Employee Name</mat-header-cell>
                            <mat-cell *matCellDef="let element"> {{ element.EmployeeName }} </mat-cell>
                        </ng-container>

                        <!-- Amount Column -->
                        <ng-container matColumnDef="amount">
                            <mat-header-cell *matHeaderCellDef> Amount </mat-header-cell>
                            <mat-cell *matCellDef="let element"> {{ element.amount }} </mat-cell>
                        </ng-container>

                        <!-- Header and Row Definitions -->
                        <mat-header-row
                            *matHeaderRowDef="['slNo', 'EmployeeCode', 'EmployeeName', 'amount']"></mat-header-row>
                        <mat-row
                            *matRowDef="let row; columns: ['slNo', 'EmployeeCode', 'EmployeeName', 'amount'];"></mat-row>
                    </mat-table>

                </div>
                <div class="containerpage">
                    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
                    </mat-paginator>
                </div>
            </div>
        </mat-card-content>
        <mat-card-footer class="footer">
            <div class="d-flex justify-content-end mt-3">
                <button type="button" class="btn btn-primary rounded-pill px-3">Save</button>
                <button type="reset" class="btn btn-primary me-2 rounded-pill px-3">Cancel</button>
            </div>
        </mat-card-footer>
    </mat-card>
</form>
