<form [formGroup]="AddReimbrusmentCalendar" novalidate>
    <mat-card class="custom-card">
        <mat-card-header class="sticky-header">
            <mat-card-title>Reimbrusment Calendar</mat-card-title>
            <span class="spacer"></span>
            <button mat-icon-button (click)="onClose()" class="no-border-icon">
                <mat-icon>close</mat-icon>
            </button>
        </mat-card-header>

        <mat-card-content class="scroll-content">
            <br />
            <!-- Row 1 -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Company Code<span class="text-danger">*</span></label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                    <!-- <input type="text" class="form-control" formControlName="POform" /> -->
                    <!-- <select class="form-select" formControlName="CompanyCode">
                        <option value="">-- Select --</option>
                    </select> -->
                </div>
                <div class="col-md-4">
                    <label class="form-label">Company Name<span class="text-danger">*</span></label>
                    <!-- <input type="date" class="form-control" formControlName="PaySeqNo" /> -->
                    <select class="form-select" formControlName="CompanyName">
                        <option value="">-- Select --</option>
                    </select>

                    <!-- <select class="form-select" formControlName="POform">
                        <option value="">-- Select --</option>
                        <option *ngFor="let PONo of PONumber" [value]="PONo.poid">{{PONo.ponumber}}</option>
                    </select> -->
                </div>
                <div class="col-md-4">
                    <label class="form-label">Carry Forward<span class="text-danger"></span></label>
                    <select class="form-select" formControlName="CarryForward">
                        <option value="">-- Select --</option>
                        <option value="1">Yes</option>
                        <option value="2">No</option>
                    </select>
                    <!-- <input type="text" class="form-control" formControlName="PODate" /> -->
                </div>
            </div>
            <!-- Row 2 -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Financial Year<span class="text-danger"></span></label>
                    <select class="form-select" formControlName="FinancialYear">
                        <option value="">-- Select --</option>
                        <option value="1">2027</option>
                        <option value="2">2026</option>
                        <option value="3">2025</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">From Date<span class="text-danger">*</span></label>
                    <input type="date" class="form-control" formControlName="FromDate" />
                </div>
                <div class="col-md-4">
                    <label class="form-label">To Date<span class="text-danger">*</span></label>
                    <input type="date" class="form-control" formControlName="ToDate" />
                </div>
            </div>
        </mat-card-content>
        <mat-card-footer class="footer">
            <div class="d-flex justify-content-end mt-3">
                <button type="button" class="btn btn-primary rounded-pill px-3">Save</button>
                <button type="reset" class="btn btn-primary me-2 rounded-pill px-3">Cancel</button>
            </div>
        </mat-card-footer>
    </mat-card>
</form>
