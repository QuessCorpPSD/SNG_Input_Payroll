<div class="page-wrapper">

    <div class="scrollable-content" style="padding-top: 2px;">
        <div
            style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 700; min-width: 960px; padding-left: 25px; padding-top: 5px;">
            Other Income
        </div>

        <div class="container-fluid" style="min-width: 960px;">
            <div class="card-body">
                <div class="row align-items-end">
                    <div class="col-md-3">
                        <label class="form-label text-muted small" style="margin-top: 0; padding-top: 0;">Company Code
                            <span style="color: red;">*</span></label>
                        <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label text-muted small" style="margin-top: 0; padding-top: 0;">Pay
                            Period<span style="color: red;">*</span></label>
                        <PayPeriod [selectedCompanyId]="selectedCompanyId" [payPeriodType]="payPeriodType"
                            (payperiodEmit)="handlePayperiodEvent($event)"></PayPeriod>
                    </div>

                    <div class="col-md-3 d-flex gap-2">
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search"
                            (click)="onsearch()" matTooltip="Search">
                            <mat-icon>search</mat-icon>
                        </button>
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-download"
                            (click)="DownloadTemplate()" matTooltip="Template">
                            <mat-icon>cloud_download</mat-icon>
                        </button>
                        <button class="btn btn-sm d-flex align-items-center justify-content-center btn-upload"
                            (click)="ImportClick(fileInput)" matTooltip="Upload">
                            <mat-icon>cloud_upload</mat-icon>
                        </button>
                        <input type="file" #fileInput style="display: none;" (click)="fileInput.value=''"
                            (change)="onFileChange($event)" accept=".xlsx, .xls" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row py-1" style="padding-left: 30px; padding-right: 30px;">
    <table class="table table-bordered">

        <tr>
            <th><span class="span-text-header">SNo</span></th> <!-- New SNo column header -->
            <th><span class="span-text-header">Company Code</span></th>
            <th><span class="span-text-header">Employee Code</span></th>
            <th><span class="span-text-header">Employee Name</span></th>
            <th><span class="span-text-header">Band Name</span></th>
            <th><span class="span-text-header">Gender</span></th>
            <th><span class="span-text-header">Incentive Pay Period</span></th>
            <th><span class="span-text-header">Pay Period</span></th>
        </tr>


        <tbody *ngIf="paginatedData">
            <tr *ngFor="let item of paginatedData; let i = index" style="height: 30px; vertical-align: middle;">
                <td><span class="span-text-detail">{{ i + 1 }}</span></td> <!-- Serial Number -->
                <td><span class="span-text-detail">{{ item.Company_Code }}</span></td>
                <td><span class="span-text-detail">{{ item.Employee_Code }}</span></td>
                <td><span class="span-text-detail">{{ item.Employee_Name }}</span></td>
                <td><span class="span-text-detail">{{ item.Band_name }}</span></td>
                <td><span class="span-text-detail">{{ item.Gender }}</span></td>
                <td><span class="span-text-detail">{{ item.Increment_Pay_Period }}</span></td>
                <td><span class="span-text-detail">{{ item.Pay_Period }}</span></td>
            </tr>
        </tbody>


    </table>

    <div style="margin-bottom: 5%;">
        <mat-paginator [length]="filteredRows.length" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20, 50]"
            (page)="onPageChange($event)">
        </mat-paginator>
    </div>
</div>




<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>

<app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="closePopup()"></app-alertpopup>
