<div class="container py-1">
    <div class="container-fluid">
        <div>
            <div class="row  align-items-end ">
                <!-- Company Code -->
                <div class="col-12 col-md-6">
                    <label for="companySelect" class="form-label small fw-semibold">Company Code</label>
                    <!-- keep your custom component; add an id for accessibility -->
                    <companyall id="companySelect" (companyEmit)="handleCompanyEvent($event)"></companyall>
                </div>

                <!-- Pay Period -->
                <div class="col-12 col-md-3">
                    <label for="payPeriod" class="form-label small fw-semibold">Pay Period</label>
                    <!-- pass inputs as before -->
                    <payperiodsequence id="payPeriod" [selectedCompanyId]="selectedCompanyId"
                        [payPeriodType]="payPeriodType" (payperiodEmit)="handlePayperiodEvent($event)">
                    </payperiodsequence>
                </div>

                <!-- Date (responsive) -->
                <div class="col-12 col-md-3">
                    <label for="dateInput" class="form-label small fw-semibold">Date</label>
                    <div class="input-group">
                        <!-- use native date control for better UX; fallback to text if not desired -->
                        <input id="dateInput" type="text" class="form-control" [(ngModel)]="selectedDate"
                            aria-label="Date" disabled />
                    </div>
                </div>
            </div>
            <div class="row align-items-end ">
                <div class="col-12 col-md-3">
                    <label for="companySelect" class="form-label small fw-semibold">Actual / Declared</label>
                    <!-- keep your custom component; add an id for accessibility -->
                    <div class="input-group">
                        <!-- use native date control for better UX; fallback to text if not desired -->
                        <input id="actualOrdelcare" type="text" class="form-control" [(ngModel)]="actual_Or_delcare"
                            disabled />
                    </div>
                </div>
                <div class="col-12 col-md-3">
                    <label for="companySelect" class="form-label small fw-semibold">Type</label>

                    <!-- keep your custom component; add an id for accessibility -->
                    <div class="input-group">
                        <select class="form-control" [(ngModel)]="selectoption">
                            <option value="PP">Regular</option>
                            <option value="FPP">F&F Process</option>
                        </select>
                    </div>

                </div>
                <div class="col-12 col-md-3" (click)="ProcessClick()" style="cursor: pointer;">
                    <div
                        style="width: 139px; height: 34px; padding-left: 16px; padding-right: 16px; padding-top: 10px; padding-bottom: 10px; background: #302CB3; border-radius: 6px; justify-content: center; align-items: center; gap: 10px; display: inline-flex">
                        <div
                            style="color: white; font-size: 16px; font-family: Nunito Sans; font-weight: 600; word-wrap: break-word">
                            Process</div>
                    </div>
                </div>
            </div>
        </div>
        <div *ngIf="showPopup" class="overlay"></div>
        <app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
            (close)="showPopup = false"></app-alertpopup>
        <div *ngIf="isLoading" class="loading-overlay">
            <img src="assets/Loading.gif" alt="Loading...">
        </div>
    </div>
</div>
