<div class="row gap-3 py-2">
    <div class="justify-content-between align-items-center mb-3">

        <mat-card-title
            style="color: #302CB3; font-size: 22px; font-family: Montserrat; font-weight: 600;padding-left: 12px;">Salary
            Release Pending /Approval
        </mat-card-title>
        <div class="container py-2">
            <div class="row g-3 align-items-end">

                <div class="col-md-2">
                    <label class="form-label text-muted small">Batch Type<span class="text-danger">*</span></label>
                    <select class="form-select form-select-sm" [(ngModel)]="Batchtype" placeholder="select">
                        <option value="">Select</option>
                        <option *ngFor="let bt of batchtype" [value]="bt.value">{{ bt.name }}</option>
                    </select>
                </div>


                <div class="col-md-2">
                    <label class="form-label text-muted small">Collection Status<span
                            class="text-danger">*</span></label>
                    <select style class="form-select form-select-sm" [(ngModel)]="CollectionStatus"
                        placeholder="select">
                        <option value="">select</option>

                        <option value="Pending">Pending</option>
                        <option value="Received">Received</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label text-muted small">Remarks</label>
                    <input class="form-control form-control-sm" type="text" [(ngModel)]="remarks" />

                </div>
                <div class="col-md-3 d-flex gap-2 button-group">

                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-search"
                        (click)="searchClick()" matTooltip="Search">
                        <mat-icon>search</mat-icon>
                    </button>
                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-secondary"
                        matTooltip="ExportToExcel" (click)="exportToExcel()">
                        <mat-icon>download</mat-icon>
                    </button>
                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-upload"
                        matTooltip="Upload">
                        <mat-icon>cloud_upload</mat-icon>
                    </button>
                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-approve"
                        (click)="Approval()" matTooltip="Approve">
                        <mat-icon class="approve-icon">check_circle</mat-icon>
                    </button>

                    <button class="btn btn-sm d-flex align-items-center justify-content-center btn-reject"
                        matTooltip="Reject" (click)="Reject()">
                        <mat-icon class="reject-icon">cancel</mat-icon>
                    </button>



                </div>

                    </div>
                </div>
                <div class="card-body rounded-4 py-0" *ngIf="istablevisible">
                    <div class="example-container mat-elevation-z8">
                        <table mat-table [dataSource]="dataSource" matSort class="custom-table mat-elevation-z8">
                            <ng-container matColumnDef="select">
                                <mat-header-cell *matHeaderCellDef class="fixed-width-column">
                                    <mat-checkbox (change)="selectAllRows($event)" [checked]="isAllSelected()"
                                        [indeterminate]="isSomeSelected()">
                                    </mat-checkbox>
                                </mat-header-cell>
                                <mat-cell *matCellDef="let element" class="fixed-width-column">
                                    <mat-checkbox [(ngModel)]="element.selected" (change)="onRowSelect(element)">
                                    </mat-checkbox>
                                </mat-cell>
                            </ng-container>


                            <ng-container matColumnDef="slno">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>
                                    <div class="cell-center">
                                        Sl No
                                    </div>
                                </mat-header-cell>
                                <mat-cell *matCellDef="let element">
                                    <div class="cell-center">
                                        <span class="offer-style">{{ element.SNo }}</span>
                                    </div>
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="company_code">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>
                                    <div class="cell-center">
                                        Company Code
                                    </div>
                                </mat-header-cell>
                                <mat-cell *matCellDef="let element">
                                    <div class="cell-center">{{ element.Company_Code }}
                                    </div>
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="InvoiceNumber">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>
                                    <div class="cell-center-wrap-normal">
                                        Invoice Number
                                    </div>
                                </mat-header-cell>
                                <mat-cell *matCellDef="let element">
                                    <div class="cell-center-wrap-normal">
                                        {{ element.Invoice_No }}</div>
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="ReleaseStatus">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>
                                    <div class="cell-center-wrap-normal">
                                        Release Status
                                    </div>
                                </mat-header-cell>
                                <mat-cell *matCellDef="let element">
                                    <div class="cell-center-wrap-normal">
                                        {{ element.Status }}</div>
                                </mat-cell>
                            </ng-container>

                            <!-- <ng-container matColumnDef="ReleaseStatus">
                        <mat-header-cell *matHeaderCellDef mat-sort-header>
                            <div class="cell-center-wrap-normal">
                                Hold
                            </div>

                        <mat-cell *matCellDef="let element">
                            <div class="cell-center-wrap clickable">₹ {{ element.Hold
                                }}
                            </div>
                        </mat-cell>
                    </ng-container> -->


                            <ng-container matColumnDef="payPeriod">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>
                                    <div class="cell-center-wrap-normal">
                                        Pay Period
                                    </div>
                                </mat-header-cell>
                                <mat-cell *matCellDef="let element">
                                    <div class="cell-center-wrap-normal">{{
                                        element.Pay_Period }}
                                    </div>
                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="remarks">
                                <mat-header-cell *matHeaderCellDef mat-sort-header>
                                    <div class="cell-center-wrap-normal">
                                        Remarks
                                    </div>
                                </mat-header-cell>
                                <mat-cell *matCellDef="let element">
                                    <div class="cell-center-wrap-normal">{{ element.Remarks
                                        }}
                                    </div>
                                </mat-cell>
                            </ng-container>

                            <!-- Header and Row Declaration -->
                            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                            <mat-row *matRowDef="let row;let i = index;  columns: displayedColumns;"></mat-row>
                        </table>
                    </div>

                    <mat-paginator class="mat-footer-paginator" [pageSizeOptions]="[5, 10, 25, 100]"
                        showFirstLastButtons stickyEnd>
                    </mat-paginator>
                </div>

            </div>
        </div>
        <div *ngIf="showPopup" class="overlay">
            <app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage"
                class="centered-popup" (close)="showPopup = false"></app-alertpopup>
        </div>
