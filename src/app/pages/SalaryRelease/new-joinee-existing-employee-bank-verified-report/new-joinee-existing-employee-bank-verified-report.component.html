<div class="container-fluid">
    <div class="card-body g-2">
        <br />
        <form>

            <div class="row g-2 align-items-end ">
                <div class="col-md-3">
                    <label class="form-label text-muted small">Company Code</label>
                    <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
                </div>

                <div class="col-md-2">
                    <label class="form-label text-muted small">From Date</label>
                    <input type="date" class="form-control form-control-sm" name="fromDateInput" />
                </div>

                <div class="col-md-2">
                    <label class="form-label text-muted small">To Date</label>
                    <input type="date" class="form-control form-control-sm" name="toDateInput" />
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button class="btn  btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="Data validated Report">
                        <mat-icon>verified</mat-icon>
                    </button>

                </div>
            </div>
        </form>
    </div>
</div>
