<div class="container py-4">
  <div class="row g-3 align-items-end">

    <div class="col-md-3">
      <label class="form-label text-muted small">Company Code</label>
      <companyall (companyEmit)="handleCompanyEvent($event)"></companyall>
    </div>

    <!-- Pay Period -->
    <div class="col-md-3">
      <label class="form-label text-muted small">Pay Period</label>
      <payperiod-salary [selectedCompanyId]="selectedCC" (payperiodEmit)="handlePayperiodEvent($event)">
      </payperiod-salary>
    </div>


    <!-- Action Buttons -->
    <div class="col-md-3 d-flex gap-2">

      <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Import" type="button"
        (click)=" triggerFileInput()">
        <mat-icon>cloud_upload</mat-icon>
      </button>
      <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)" />

      <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Export to Excel"
        (click)="searchAndDownloadExcel()">
        <mat-icon>table_chart</mat-icon>
      </button>
      <button *ngIf="isUploadDataVisible" class="btn btn-sm d-flex align-items-center justify-content-center"
        matTooltip="Submit Uploaded Data" (click)="submitUploadedData()">
        <mat-icon>check_circle</mat-icon>
      </button>

      <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)" accept=".xlsx, .xls" />


      <!-- Download Template -->
      <button class="btn btn-sm d-flex align-items-center justify-content-center" matTooltip="Download Template"
        type="button" (click)="DownloadTemplate()">
        <mat-icon>cloud_download</mat-icon>
      </button>


    </div>

  </div>

  <br />


  <!-- Uploaded Data Grid - Responsive with white background -->
  <div class="container-fluid mt-4" *ngIf="isUploadGridVisible">
    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <mat-table [dataSource]="uploadedDataSource" class="mat-elevation-z0">
            <!-- Dynamic columns based on Excel headers -->
            <ng-container *ngFor="let column of uploadDisplayedColumns" [matColumnDef]="column">
              <th mat-header-cell *matHeaderCellDef class="bg-light">
                <strong>{{ column }}</strong>
              </th>
              <td mat-cell *matCellDef="let row" class="border-bottom">
                {{ row[column] }}
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="uploadDisplayedColumns" class="bg-light"></tr>
            <tr mat-row *matRowDef="let row; columns: uploadDisplayedColumns;"></tr>
          </mat-table>
        </div>

        <!-- No data message -->
        <div *ngIf="uploadedData.length === 0" class="text-center p-4">
          <p class="text-muted">No data to display</p>
        </div>
      </div>
    </div>
  </div>
  <br />

  <!-- Existing Search Results Table -->
  <div class="table-wrapper" *ngIf="isTableVisible && !isUploadGridVisible">
    <div class="table-scroll">
      <mat-table [dataSource]="dataSource" matSort class="custom-table mat-elevation-z8">
        <!-- Your existing table columns -->
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox class="small-checkbox" (change)="selectAllRows($event)" [checked]="isSelectAllChecked">
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox [(ngModel)]="row.selected" (change)="updateSelectedRows()"></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="invoice_no">
          <th mat-header-cell *matHeaderCellDef> Invoice No </th>
          <td mat-cell *matCellDef="let row"> {{ row.invoice_no }} </td>
        </ng-container>

        <ng-container matColumnDef="company_Code">
          <th mat-header-cell *matHeaderCellDef> Company Code </th>
          <td mat-cell *matCellDef="let row"> {{ row.company_Code }} </td>
        </ng-container>

        <ng-container matColumnDef="total_emp">
          <th mat-header-cell *matHeaderCellDef> Headcount </th>
          <td mat-cell *matCellDef="let row"> {{ row.total_emp }} </td>
        </ng-container>

        <ng-container matColumnDef="net_Pay">
          <th mat-header-cell *matHeaderCellDef> Net Pay </th>
          <td mat-cell *matCellDef="let row"> {{ row.net_Pay }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </mat-table>
    </div>

    <mat-paginator [length]="dataSource.data.length" [pageSize]="10" [pageSizeOptions]="[5, 10, 20]"
      (page)="pageChanged($event)">
    </mat-paginator>
  </div>
  <div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
  </div>
  <div *ngIf="showPopup" class="overlay"></div>
  <app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="closePopup()"></app-alertpopup>
