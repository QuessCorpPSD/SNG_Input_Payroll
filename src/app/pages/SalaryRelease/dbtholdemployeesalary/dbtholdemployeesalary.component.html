<div class="container-fluid">
    <div class="card-body g-2">
        <br />
        <form>
            <div class="row g-2 align-items-end ">
                <div class="col-md-3">
                    <label class="form-label text-muted small">Upload Type</label>
                    <select class="form-select form-select-sm small-input" [(ngModel)]="selectedUploadType"
                        [ngModelOptions]="{standalone: true}">
                        <option value="">Select</option>
                        <option *ngFor="let upload of type" [value]="upload.value">{{ upload.name }}</option>
                    </select>

                </div>
                <div class="col-md-4 d-flex gap-2">
                    <!-- Import Button -->
                    <button type="button" class="btn  btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="Import" (click)="triggerFileInput()">
                        <mat-icon>cloud_upload</mat-icon>
                    </button>
                    <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)" />

                    <button *ngIf="isUploadDataVisible"
                        class="btn btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="Submit Uploaded Data" (click)="submitUploadedData()">
                        <mat-icon>check_circle</mat-icon>
                    </button>

                    <!-- Download Button -->
                    <button class="btn btn-sm d-flex align-items-center justify-content-center"
                        matTooltip="Download Template" (click)="DownloadTemplate()">
                        <mat-icon>cloud_download</mat-icon>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="container-fluid mt-4" *ngIf="isUploadGridVisible">
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <mat-table [dataSource]="uploadedDataSource" class="mat-elevation-z0">
                    <!-- Dynamic columns based on Excel headers -->
                    <ng-container *ngFor="let column of uploadDisplayedColumns" [matColumnDef]="column">
                        <th mat-header-cell *matHeaderCellDef class="bg-light">
                            <strong>{{ column }}</strong>
                        </th>
                        <td mat-cell *matCellDef="let row" class="border-bottom">
                            {{ row[column] }}
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="uploadDisplayedColumns" class="bg-light"></tr>
                    <tr mat-row *matRowDef="let row; columns: uploadDisplayedColumns;"></tr>
                </mat-table>
            </div>

            <!-- No data message -->
            <div *ngIf="uploadedData.length === 0" class="text-center p-4">
                <p class="text-muted">No data to display</p>
            </div>
        </div>
    </div>
</div>
<div *ngIf="isLoading" class="loading-overlay">
    <img src="assets/Loading.gif" alt="Loading...">
</div>

<div *ngIf="showPopup" class="overlay"></div>
<app-alertpopup *ngIf="showPopup" [message]="popupMessage" [submessage]="popupSubMessage" class="centered-popup"
    (close)="closePopup()"></app-alertpopup>
