<mat-form-field class="w-100 custom-height rounded-1" appearance="outline" style="background-color: white;height:30px;">
  <input style="color: #222;font-family: Montserrat; font-size: 12px; font-weight: 500;" type="text" matInput
    [formControl]="myControl" placeholder="Select PO Type" [matAutocomplete]="auto" />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn"
    (optionSelected)="onOptionSelected($event.option.value)">
    <mat-option style="font-size: 11px;line-height: 20px;" *ngFor="let option of filteredOptions$ | async"
      [value]="option">
      {{ option.invoiceType }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
